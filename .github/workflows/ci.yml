name: Flutter CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch 3.38.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "f6ff1529fd6d8af5f706051d9251ac9231c83407"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Set up Java for Android
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android demo APKs
        run: flutter build apk --debug --target-platform android-arm64,android-x64 --split-per-abi --no-pub
      - name: Record demo checksums
        working-directory: build/app/outputs/flutter-apk
        shell: bash
        run: |
          sha256sum app-arm64-v8a-debug.apk app-x86_64-debug.apk > SHA256SUMS.txt
          {
            echo '### BarberBook Demo APKs'
            echo
            echo "Source commit: $GITHUB_SHA"
            echo
            echo 'Artifact: barberbook-demo-debug (14 days). Android package: com.barberbook.portfolio.'
            echo
            echo '```text'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo 'Device acceptance guide: docs/device-acceptance.md'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload demo APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: barberbook-demo-debug
          path: |
            build/app/outputs/flutter-apk/*-debug.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          archive: true
